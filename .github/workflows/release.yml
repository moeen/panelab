name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release draft
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the version and reviewed release notes
        run: node scripts/release.ts check "$GITHUB_REF_NAME"
      - name: Require successful main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts ci "$GITHUB_SHA"
      - run: pnpm check
      - name: Build unsigned app
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 -- *.zip > SHA256SUMS.txt
      - name: Sign checksums for the in-app updater
        env:
          PANELAB_UPDATE_SIGNING_KEY: ${{ secrets.PANELAB_UPDATE_SIGNING_KEY }}
        run: node scripts/sign-update.ts dist/SHA256SUMS.txt
      - name: Verify updater artifacts
        run: node scripts/release.ts verify "$GITHUB_REF_NAME" dist
      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/PaneLab-${GITHUB_REF_NAME#v}-arm64.zip" dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sig --draft --title "PaneLab $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --verify-tag --latest=false
